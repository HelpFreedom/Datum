# ---------------------------------------------------------------- материалы
#
# Здесь и начинается «реестр незамеренного». Ни одно из этих чисел не измерено
# на нашем принтере нашим филаментом — все взяты из справочников, где разброс
# двукратный. Пока они assumed, снимок не готов к печати.
# Не блокирует. От него зависят силы флексуры и устойчивость тяги, но
# `datum sweep` показывает: при любом значении из диапазона все они проходят.
# Пометка стояла, и проект был «не готов к печати» из-за числа, которое ни
# одного вердикта не меняет. Закрытие шибера на краю, но считается оно по
# E_PETG, как и в оригинале.
# 3000 — константа оригинала (`calc.py`: E = {"PLA": 3000.0, ...}); у latch
# своё 2000 [1500…3500] — там это собственная догадка, не перенесённая.
# Разные числа одного материала в двух проектах — нормально, пока оба
# `assumed` с диапазонами: каждый проект отвечает за свою догадку.
E_PLA:
  value: 3000.0
  unit: MPa
  provenance: assumed
  range: [2000.0, 3600.0]
  reason: "модуль упругости печатного PLA: зависит от ориентации слоёв и заполнения"
  validate_with: test_coupon

