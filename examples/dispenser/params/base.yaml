# Дозатор зубной пасты: носовой узел и флексура.
#
# Порт второго проекта рабочего процесса CAD (toothpaste-dispenser). Взят ради
# одной вещи: у него СОВСЕМ ДРУГОЙ набор проверок — не зацепы и посадки, а
# аналитика. Деформация листа, жёсткость пружины, сила через кулачок,
# устойчивость. Если библиотека проверок Datum обобщается, она должна покрыть и
# это; если нет — станет видно, чего в ней не хватает.
#
# Свойства материала объявлены ПАРАМЕТРАМИ, а не спрятаны в проверках. У
# печатного PLA модуль упругости зависит от ориентации слоёв вдвое, и число,
# выглядящее точным, дало бы уверенность на пустом месте. Развёртка по
# незамеренному (sweep_assumed) показывает, какая из догадок решает дело.

