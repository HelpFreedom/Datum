# Порядок сборки: каждая следующая деталь входит в уже собранное.
#
# Записан он не для красоты: из него ВЫВОДЯТСЯ проверки собираемости, и
# препятствием для каждой детали становятся все предыдущие. Перечислять их
# руками в checks.yaml не нужно — а забыть перечислить было бы легко, и
# проверка стала бы зелёной по недосмотру.
order:
  - корпус          # основание, его никуда не вставляют
  - крышка

parts:
  крышка:
    # Крышка шире проёма: её держит губка. Прямолинейного пути без задевания у
    # неё нет и быть не должно — она заводится с прогибом. Поэтому не
    # `assembly_path` («есть ли свободный путь»), а `snap_insertion` («сколько
    # продавить и выходит ли в конце на свободу»).
    method: snap
    # Направление ВСТАВКИ: крышка вдавливается сверху вниз. Она сидит на
    # Z 13.7…16.7 под губкой, начинающейся с 17, — иначе и не попасть.
    # Куда заводится, геометрия не знает, это замысел. Вбок, кстати,
    # продавливается МЕНЬШЕ (212 против 269 мм³), только вбок крышка пошла бы
    # сквозь стенку корпуса.
    insert: "-Z"
    # Замерено на текущих параметрах: 195 мм³ (было 269, пока у губки не
    # появилась заходная фаска). Порог с запасом — он стережёт не сегодняшнее
    # число, а то, чтобы защёлка не стала туже при изменении LIP_D, GAP или
    # LEAD_IN.
    snap_vol: 320
    distance: 20

explode:
  gap: 25
