# Главная проверка: крышку должно удерживать ПОСЛЕ того, как она выберет
# печатный зазор. Именно её отсутствие стоило трёх печатей в phone-case-gears.
- id: крышка.зацеп
  use: escape
  args:
    part: "@крышка"
    holder: "@корпус"
    dirs: ["+Z", "+X", "-X", "+Y", "-Y"]
    gap: "${params.GAP}"
    hold_vol: 1.0
  severity: blocking

- id: крышка.целостность
  use: single_body
  args: {part: "@крышка"}

- id: корпус.целостность
  use: single_body
  args: {part: "@корпус"}

- id: корпус.без_пузырей
  use: no_sealed_void
  args: {part: "@корпус"}

- id: крышка.стенка
  use: min_wall
  args: {part: "@крышка", wall: "${params.WALL}", samples: 12}

- id: корпус.на_столе
  use: bbox_fits
  args: {part: "@корпус"}

# С какой силой крышку вставляют. Три звена: насколько отжать (МЕРИТСЯ по
# геометрии), какая сила на это нужна (МКЭ, вилкой, с самопроверкой), во что
# она превращается на скосе (клин с трением).
#
# Ради этой проверки в корпусе и появилась заходная фаска LEAD_IN. Без неё
# губка была прямой ступенькой: жёсткая крышка такую не проходит вовсе, и
# усилие вставки не определено — сколько ни дави. Объёмная проверка
# продавливания этого не видела, она мерит объём, а не путь, по которому
# крышка съезжает.
#
# Упругий элемент объявлен, а не угадан: прогибается СТЕНКА корпуса от пола до
# губки, а не сама губка. Геометрия этого знать не может — это зависит от
# соотношения жёсткостей.
- id: крышка.усилие_вставки
  use: insertion_force
  args:
    part: "@крышка"
    obstacles: ["@корпус"]
    direction: "-Z"
    spring_length: "${expr: CASE_H - FLOOR}"
    spring_width: "${params.CASE_W}"
    spring_thickness: "${params.WALL}"
    modulus: "${params.E_PLA}"
    poisson: "${params.POISSON_PLA}"
    friction: "${params.FRICTION}"
    distance: 8.0
    samples: 81
    max_force: 60.0
    part_name: крышка
  severity: warn
