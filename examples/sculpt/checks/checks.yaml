- id: подставка.целостность
  use: single_body
  args: {part: "@подставка"}
- id: подставка.без_пузырей
  use: no_sealed_void
  args: {part: "@подставка"}
- id: подставка.на_столе
  use: bbox_fits
  args: {part: "@подставка"}
# Предел уклона 45° строит форму без нависаний, но растр правила 45° у
# проверки и сетка поля — разные дискретизации: порог — малые кубики на
# стыках ячеек узора, не настоящие нависания.
- id: подставка.поддержки
  use: support_volume
  args: {part: "@подставка", max_volume: 20.0}
- id: подставка.мосты
  use: bridge_span
  args: {part: "@подставка"}
- id: подставка.стенки
  use: min_wall
  args: {part: "@подставка", wall: 1.2}
