schema = 1
name = "arm"
units = "mm"

# Пример симуляции механизма (MuJoCo): двухзвенная рука на двух сервах стоит на
# столе, без струбцины. Хватит ли серв, не опрокинется ли, не задевает ли.

[printer]
profile = "elegoo-cc2-0.4"
bed = [256, 256, 256]
nozzle = 0.4
layer = 0.20
material = "PLA"

# Настройки печати по умолчанию для всех деталей; у звеньев — свои (@part print=…).
# По ним считается масса для симуляции, и они же уходят в слайсер при slice.
[print]
walls = 3
infill = 0.2

[build]
guard = "checkpoint"
