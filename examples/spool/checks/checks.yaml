# Деталь одна, и почти все проверки здесь — о том, что она ПРИГОДНА К ПЕЧАТИ
# одним куском. У прежнего процесса это было не так: печатный меш резался
# отдельным путём, и совпадение форм ничем не проверялось.

- id: подставка.целостность
  use: single_body
  args: {part: "@подставка"}
  severity: blocking

- id: подставка.без_пузырей
  use: no_sealed_void
  args: {part: "@подставка"}
  severity: blocking

# Рифление — 168 мелких вычитаний подряд. Именно на таком OCCT давал трещины,
# а у меша беда была бы другая: лезвия от почти совпадающих граней.
- id: подставка.без_лезвий
  use: no_slivers
  args: {part: "@подставка"}
  severity: blocking

- id: подставка.на_столе
  use: bbox_fits
  args: {part: "@подставка"}

# Порог по КРУПНЕЙШЕМУ тонкому месту, а не по доле площади: рифление оставляет
# 168 тонких гребешков, и по доле они выглядели бы бедой.
- id: подставка.стенка
  use: min_wall
  args: {part: "@подставка", wall: 1.6, samples: 20, max_lost_area: 5.0}

# NOTES оригинала: «Уклон и люльки без поддержек (DfAM: нависаний < 45° столько
# же, сколько у оригинала — это 45° фаска по низу)». Здесь это число, а не
# утверждение: 1.5 % поверхности, и всё оно — та самая фаска.
- id: подставка.нависания
  use: overhang
  args: {part: "@подставка", limit_deg: 45.0, max_frac: 0.15}

# NOTES оригинала утверждают: «Уклон и люльки без поддержек». Здесь это число,
# а не утверждение — и оно подтвердилось: ноль поддержек, ноль мостов.
- id: подставка.поддержки
  use: support_volume
  args: {part: "@подставка", max_volume: 1.0, step: 1.0}

- id: подставка.мосты
  use: bridge_span
  args: {part: "@подставка", max_span: 30.0, step: 1.0}

- id: подставка.прилипание
  use: bed_contact
  args: {part: "@подставка", min_area: 5000.0}
