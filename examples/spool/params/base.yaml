# Подставка под кабельные катушки. Третий портированный проект корпуса
# (`projects/spool-base` корпуса прежних проектов), и взят он не случайно: именно на нём
# у прежнего рабочего процесса РАСКАЛЫВАЛСЯ конвейер — мешер OCCT на 168
# канавках вместе с фасками давал 164 открытых ребра, и печатный меш приходилось
# резать отдельно, через manifold.
#
# Происхождение здесь настоящее: почти всё СНЯТО С ИСХОДНОГО МЕША сечениями
# (так и записано в NOTES оригинала), а выбрано человеком только новое число и
# ширина отсеков.
#
# Обмер делал ОРИГИНАЛ, не Datum. Исходный меш —
# projects/spool-base/input/spool_base.3mf корпуса — в порт не
# скопирован: это чужая покупная модель, и числа в `source` ниже ссылаются на
# сечения, снятые с неё там. Перемерить — `import_model` её в проект и
# `section` по тем же местам.

# --- снято с оригинала
WIDTH:
  value: 81.96
  unit: mm
  provenance: measured
  source: "сечения spool_base.3mf оригинала, корпус по X до вершин рёбер"
  instrument: model-section
  tolerance: 0.05
HEIGHT:
  value: 36.0
  unit: mm
  provenance: measured
  source: "высота задней части, сечения оригинала"
  instrument: model-section
  tolerance: 0.05
FRONT_H:
