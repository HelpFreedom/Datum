  unit: mm
  provenance: measured
  source: "высота передней стенки"
  instrument: model-section
  tolerance: 0.05
TOP_R:
  value: 12.0
  unit: mm
  provenance: measured
  source: "скругление перехода верх/уклон"
  instrument: model-section
  tolerance: 0.3
CORNER_R:
  value: 9.7
  unit: mm
  provenance: measured
  source: "углы корпуса в плане"
  instrument: model-section
  tolerance: 0.2
BOTTOM_CHAMFER:
  value: 2.0
  unit: mm
  provenance: measured
  source: "фаска по низу, 45°"
  instrument: model-section
  tolerance: 0.1
CRADLE_R:
  value: 38.69
  unit: mm
  provenance: measured
  source: "дуга люльки отсека"
  instrument: model-section
  tolerance: 0.1
CRADLE_UP:
  value: 5.8
  unit: mm
  provenance: measured
  source: "центр дуги люльки выше верха корпуса"
  instrument: model-section
  tolerance: 0.1
DIV_T:
  value: 3.0
  unit: mm
  provenance: measured
  source: "перегородка между отсеками"
  instrument: model-section
  tolerance: 0.05
END_T:
  value: 5.0
  unit: mm
  provenance: measured
  source: "торцевая стенка (5.2/5.0 у оригинала, взято 5.0)"
  instrument: model-section
  tolerance: 0.1
GROOVE_TOP_W:
  value: 2.0
  unit: mm
  provenance: measured
  source: "рифление: ширина канавки на поверхности"
  instrument: model-section
  tolerance: 0.1
GROOVE_BOT_W:
  value: 1.0
  unit: mm
  provenance: measured
  source: "рифление: ширина дна канавки"
  instrument: model-section
