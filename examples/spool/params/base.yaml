GROOVE_DEPTH:
  value: 1.0
  unit: mm
  provenance: measured
  source: "глубина канавки"
  instrument: model-section
  tolerance: 0.1

# --- выбрано человеком: новая раскладка
N_SLOTS:
  value: 6
  unit: ""
  provenance: chosen
  reason: "шесть отсеков вместо четырёх у оригинала"
SLOT_L:
  value: 26.0
  unit: mm
  provenance: chosen
  reason: "ширина отсека под катушку 26 мм вместо 33 у оригинала"
GROOVE_PITCH:
  value: 3.05
  unit: mm
  provenance: chosen
  reason: "целевой шаг рифления; настоящий подбирается под целое кратное 4"
TOP_FLAT_X:
  value: 0.0
  unit: mm
  provenance: chosen
  reason: "до какого X верх плоский, дальше уклон к передней кромке"

# --- производные
LENGTH:
  provenance: derived
  expr: "2 * END_T + N_SLOTS * SLOT_L + (N_SLOTS - 1) * DIV_T"
  unit: mm
CRADLE_CZ:
  provenance: derived
  expr: "HEIGHT + CRADLE_UP"
  unit: mm
