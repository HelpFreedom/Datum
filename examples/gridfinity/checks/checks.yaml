- id: ящик.целостность
  use: single_body
  args: {part: "@ящик"}
- id: ящик.без_пузырей
  use: no_sealed_void
  args: {part: "@ящик"}
- id: ящик.на_столе
  use: bbox_fits
  args: {part: "@ящик"}
# Правило 45° насчитывает здесь ~200 мм³ — и это не губка и не перегородки.
# Замерено: у ящика 1×1 поддержек ноль, 2×1 — 36 мм³, 3×2 — 198 мм³, то есть
# они растут с числом СТЫКОВ ячеек: над щелью между основаниями соседних ячеек
# свод шириной до 4 мм. Это мост (см. ящик.мосты), и слайсер проходит его без
# опор. Порог стережёт другое: чтобы новый карман или отсек не принёс
# настоящего нависания.
- id: ящик.поддержки
  use: support_volume
  args: {part: "@ящик", max_volume: 300.0}
- id: ящик.мосты
  use: bridge_span
  args: {part: "@ящик"}
- id: плита.целостность
  use: single_body
  args: {part: "@плита"}
- id: плита.на_столе
  use: bbox_fits
  args: {part: "@плита"}
- id: плита.поддержки
  use: support_volume
  args: {part: "@плита", max_volume: 1.0}
